name: Maintenance cycle

on:
  workflow_dispatch:
    inputs:
      initial_cursor:
        description: Reviewed gentoo-zh/overlay commit used only to seed missing state
        required: false
        type: string
      candidate_action:
        description: Reviewed action applied only to restored authenticated state
        required: false
        default: none
        type: choice
        options:
          - none
          - transition
          - link-evidence
      candidate_key:
        description: Exact candidate key for the reviewed action
        required: false
        type: string
      candidate_from_state:
        description: Expected current state for a transition
        required: false
        type: string
      candidate_to_state:
        description: Requested state for a transition
        required: false
        type: string
      candidate_reason:
        description: Reviewed reason stored with the decision
        required: false
        type: string
      evidence_fingerprint:
        description: Stored evidence fingerprint for linking or promotion
        required: false
        type: string
      checklist_json:
        description: Optional promotion checklist encoded as one JSON object
        required: false
        type: string
  schedule:
    - cron: "17 3 * * 1"

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: skill-maintenance-cycle
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Verify triggered checkout identity
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "$checked_out_sha" != "$GITHUB_SHA" ]]; then
            echo "checked-out revision does not match the workflow trigger" >&2
            exit 1
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install test environment
        run: python -m pip install -e './gzh[test]'
      - name: Restore authenticated maintenance state
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_SEED: ${{ inputs.initial_cursor || '' }}
          CANDIDATE_ACTION: ${{ inputs.candidate_action || 'none' }}
        shell: bash
        run: |
          set +e
          mkdir -p maintenance-output
          printf '/maintenance-output/\n' >> .git/info/exclude
          (
            set -euo pipefail
            workflow_path=".github/workflows/reference-audit.yml"
            state_db="maintenance-output/maintenance-state.db"
            artifact_json="maintenance-output/artifacts.json"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=skill-maintenance-state&per_page=100" > "$artifact_json"
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/reference-audit.yml/runs?branch=master&per_page=100" > maintenance-output/workflow-runs.json
            prior_runs="$(jq --argjson current_run_id "$GITHUB_RUN_ID" '[.workflow_runs[] | select(
                  .id != $current_run_id
                  and .status == "completed"
                  and (.conclusion == "success" or .conclusion == "failure")
                  and (.event == "schedule" or .event == "workflow_dispatch")
                )] | length' maintenance-output/workflow-runs.json)"
            mapfile -t candidates < <(
              jq -r '.artifacts
                | map(select(.expired == false))
                | sort_by(.created_at) | reverse
                | .[] | [.id, .workflow_run.id] | @tsv' "$artifact_json"
            )
            selected_artifact=""
            eligible_candidates=0
            for candidate in "${candidates[@]}"; do
              read -r artifact_id run_id <<< "$candidate"
              if ! gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" > maintenance-output/candidate-run.json; then
                echo "failed to retrieve workflow run for state artifact ${artifact_id}" >&2
                exit 1
              fi
              if jq -e --arg repository "$GITHUB_REPOSITORY" --arg workflow "$workflow_path" '
                    .repository.full_name == $repository
                    and .path == $workflow
                    and .head_branch == "master"
                    and .status == "completed"
                    and (.conclusion == "success" or .conclusion == "failure")
                    and (.event == "schedule" or .event == "workflow_dispatch")
                  ' maintenance-output/candidate-run.json >/dev/null; then
                if ! gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?filter=latest&per_page=100" > maintenance-output/candidate-jobs.json; then
                  echo "failed to retrieve workflow jobs for state artifact ${artifact_id}" >&2
                  exit 1
                fi
                head_sha="$(jq -r '.head_sha' maintenance-output/candidate-run.json)"
                if jq -e --arg head_sha "$head_sha" '[.jobs[] | select(
                      .status == "completed" and .head_sha == $head_sha
                      and ([.steps[] | select(.name == "Seal maintenance state") | .conclusion] | first) == "success"
                      and ([.steps[] | select(.name == "Preserve authenticated maintenance state") | .conclusion] | first) == "success"
                    )] | select(length == 1) | .[0]' maintenance-output/candidate-jobs.json > maintenance-output/candidate-job.json; then
                  eligible_candidates=$((eligible_candidates + 1))
                  candidate_zip="maintenance-output/candidate-state-${artifact_id}.zip"
                  candidate_dir="maintenance-output/candidate-state-${artifact_id}"
                  if ! gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$candidate_zip"; then
                    echo "failed to download eligible state artifact ${artifact_id}" >&2
                    exit 1
                  fi
                  if (
                    set -euo pipefail
                    mkdir "$candidate_dir"
                    unzip -q "$candidate_zip" -d "$candidate_dir"
                    mapfile -t restored_entries < <(
                      find "$candidate_dir" -mindepth 1 -printf '%P\n' | sort
                    )
                    if [[ "${restored_entries[*]}" != "maintenance-state.db maintenance-state.manifest.json" ]]; then
                      echo "state artifact has an unexpected file set" >&2
                      exit 1
                    fi
                    python .agents/skills/gzh-maintain-skills/scripts/state_bundle.py verify --database "$candidate_dir/maintenance-state.db" --manifest "$candidate_dir/maintenance-state.manifest.json" > maintenance-output/authenticated-state.json
                    python .agents/skills/gzh-maintain-skills/scripts/state_bundle.py verify-provenance --manifest "$candidate_dir/maintenance-state.manifest.json" --run-record maintenance-output/candidate-run.json --job-record maintenance-output/candidate-job.json --repository "$GITHUB_REPOSITORY" --workflow "$workflow_path" --branch master > maintenance-output/authenticated-provenance.json
                  ); then
                    selected_artifact="$artifact_id"
                    cp maintenance-output/candidate-run.json maintenance-output/authenticated-run.json
                    cp maintenance-output/candidate-job.json maintenance-output/authenticated-job.json
                    mv "$candidate_dir/maintenance-state.db" "$state_db"
                    break
                  fi
                  echo "eligible state artifact ${artifact_id} failed content verification" >&2
                  exit 1
                fi
              fi
            done

            restored=false
            stored_cursor=""
            if [[ -n "$selected_artifact" ]]; then
              restored=true
              python .agents/skills/gzh-maintain-skills/scripts/evidence_store.py --db "$state_db" latest-cursor --adapter-id gentoo-zh --canonical-repository gentoo-zh/overlay > maintenance-output/cursor.json
              stored_cursor="$(jq -r '.revision // empty' maintenance-output/cursor.json)"
            elif (( eligible_candidates > 0 )); then
              echo "no eligible state artifact passed content verification" >&2
              exit 1
            fi

            decision=(
              python .agents/skills/gzh-maintain-skills/scripts/state_bundle.py
              restore-decision --prior-runs "$prior_runs" --event "$GITHUB_EVENT_NAME"
            )
            if [[ "$restored" == "true" ]]; then
              decision+=(--restored)
            fi
            if [[ -n "$REVIEWED_SEED" ]]; then
              decision+=(--reviewed-seed "$REVIEWED_SEED")
            fi
            if [[ -n "$stored_cursor" ]]; then
              decision+=(--stored-cursor "$stored_cursor")
            fi
            "${decision[@]}" > maintenance-output/state-restore-decision.json
            cursor="$(jq -r '.cursor' maintenance-output/state-restore-decision.json)"
            mode="$(jq -r '.mode' maintenance-output/state-restore-decision.json)"
            if [[ "$CANDIDATE_ACTION" != "none" && "$mode" != "restored" ]]; then
              echo "candidate decisions require existing authenticated state with an established cursor" >&2
              exit 1
            fi
            if [[ "$(jq -r '.initialize' maintenance-output/state-restore-decision.json)" == "true" ]]; then
              python .agents/skills/gzh-maintain-skills/scripts/evidence_store.py --db "$state_db" init
            fi
            printf '%s\n' "$mode" > maintenance-output/state-bootstrap.txt
            printf '%s\n' "$REVIEWED_SEED" > maintenance-output/reviewed-seed.txt
            printf '%s\n' "$cursor" > maintenance-output/after-revision.txt
          ) > maintenance-output/state-restore.log 2>&1
          status=$?
          printf '%s\n' "$status" > maintenance-output/state.status
          if (( status != 0 )); then
            jq -n --arg error "$(tail -c 12000 maintenance-output/state-restore.log)" '{schema: 1, ok: false, complete: false, truncated: false, stage: "state-restore", error: $error}' > maintenance-output/maintenance-report.json
            {
              printf '<!-- gentoo-zh-skills-maintenance:v1 -->\n'
              printf '# Skill maintenance review required\n\n'
              printf 'Authenticated state restoration failed.\n\n'
              printf '## State restoration\n\n~~~text\n'
              tail -c 12000 maintenance-output/state-restore.log
              printf '\n~~~\n'
            } > maintenance-output/maintenance-report.md
          fi
          cat maintenance-output/state-restore.log
          exit 0
      - name: Apply reviewed candidate decision
        env:
          CANDIDATE_ACTION: ${{ inputs.candidate_action || 'none' }}
          CANDIDATE_KEY: ${{ inputs.candidate_key || '' }}
          CANDIDATE_FROM_STATE: ${{ inputs.candidate_from_state || '' }}
          CANDIDATE_TO_STATE: ${{ inputs.candidate_to_state || '' }}
          CANDIDATE_REASON: ${{ inputs.candidate_reason || '' }}
          EVIDENCE_FINGERPRINT: ${{ inputs.evidence_fingerprint || '' }}
          CHECKLIST_JSON: ${{ inputs.checklist_json || '' }}
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            if [[ "$CANDIDATE_ACTION" == "none" ]]; then
              if [[ -n "$CANDIDATE_KEY$CANDIDATE_FROM_STATE$CANDIDATE_TO_STATE$CANDIDATE_REASON$EVIDENCE_FINGERPRINT$CHECKLIST_JSON" ]]; then
                echo "candidate decision fields require an explicit candidate action" >&2
                exit 1
              fi
              jq -n --arg actor "$GITHUB_ACTOR" --arg action "$CANDIDATE_ACTION" '{schema: 1, status: "not-requested", changed: false, actor: $actor, action: $action}' > maintenance-output/candidate-decision.json
              exit 0
            fi
            if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
              echo "candidate decisions require an authenticated workflow_dispatch event" >&2
              exit 1
            fi
            if [[ "$(cat maintenance-output/state.status 2>/dev/null || printf 1)" != "0" ]]; then
              echo "candidate decisions require successful authenticated state restoration" >&2
              exit 1
            fi
            if [[ "$(cat maintenance-output/state-bootstrap.txt)" != "restored" ]]; then
              echo "candidate decisions cannot mutate new or recovered empty state" >&2
              exit 1
            fi
            jq -e '.verified == true' maintenance-output/authenticated-state.json >/dev/null
            jq -e --arg repository "$GITHUB_REPOSITORY" '.verified == true and .repository == $repository' maintenance-output/authenticated-provenance.json >/dev/null
            if [[ -z "$CANDIDATE_KEY" || -z "$CANDIDATE_REASON" ]]; then
              echo "candidate key and reviewed reason are required" >&2
              exit 1
            fi
            command=(
              python .agents/skills/gzh-maintain-skills/scripts/evidence_store.py
              --db maintenance-output/maintenance-state.db
            )
            case "$CANDIDATE_ACTION" in
              transition)
                if [[ -z "$CANDIDATE_FROM_STATE" || -z "$CANDIDATE_TO_STATE" ]]; then
                  echo "candidate transitions require expected and requested states" >&2
                  exit 1
                fi
                command+=(
                  transition "$CANDIDATE_KEY"
                  --from-state "$CANDIDATE_FROM_STATE"
                  --to-state "$CANDIDATE_TO_STATE"
                  --reason "$CANDIDATE_REASON"
                )
                if [[ -n "$EVIDENCE_FINGERPRINT" ]]; then
                  command+=(--evidence-fingerprint "$EVIDENCE_FINGERPRINT")
                fi
                if [[ -n "$CHECKLIST_JSON" ]]; then
                  printf '%s\n' "$CHECKLIST_JSON" > maintenance-output/candidate-checklist.json
                  jq -e 'type == "object"' maintenance-output/candidate-checklist.json >/dev/null
                  command+=(--checklist maintenance-output/candidate-checklist.json)
                fi
                ;;
              link-evidence)
                if [[ -z "$EVIDENCE_FINGERPRINT" ]]; then
                  echo "evidence linking requires a stored evidence fingerprint" >&2
                  exit 1
                fi
                if [[ -n "$CANDIDATE_FROM_STATE$CANDIDATE_TO_STATE$CHECKLIST_JSON" ]]; then
                  echo "transition states and checklists are not valid for evidence linking" >&2
                  exit 1
                fi
                command+=(
                  link-evidence "$CANDIDATE_KEY" "$EVIDENCE_FINGERPRINT"
                  --reason "$CANDIDATE_REASON"
                )
                ;;
              *)
                echo "unsupported candidate action: $CANDIDATE_ACTION" >&2
                exit 1
                ;;
            esac
            "${command[@]}" > maintenance-output/candidate-decision-result.json
            jq -n --arg actor "$GITHUB_ACTOR" --arg action "$CANDIDATE_ACTION" --slurpfile result maintenance-output/candidate-decision-result.json '{schema: 1, status: "applied", changed: true, actor: $actor, action: $action, result: $result[0]}' > maintenance-output/candidate-decision.json
          ) > maintenance-output/candidate-decision.log 2>&1
          status=$?
          if (( status != 0 )); then
            jq -n --arg actor "$GITHUB_ACTOR" --arg action "$CANDIDATE_ACTION" --arg error "$(tail -c 12000 maintenance-output/candidate-decision.log)" '{schema: 1, status: "failed", changed: false, actor: $actor, action: $action, error: $error}' > maintenance-output/candidate-decision.json
          fi
          printf '%s\n' "$status" > maintenance-output/decision.status
          cat maintenance-output/candidate-decision.log
          exit 0
      - name: Run maintenance cycle
        shell: bash
        run: |
          set +e
          if [[ "$(cat maintenance-output/state.status)" != "0" || "$(cat maintenance-output/decision.status)" != "0" ]]; then
            printf '1\n' > maintenance-output/cycle.status
            exit 0
          fi
          python .agents/skills/gzh-maintain-skills/scripts/maintenance_cycle.py --fetch --require-synced-master --output maintenance-output/maintenance-report.json --markdown-output maintenance-output/maintenance-report.md --evidence-db maintenance-output/maintenance-state.db
          status=$?
          printf '%s\n' "$status" > maintenance-output/cycle.status
          exit 0
      - name: Run durable maintenance queue
        shell: bash
        run: |
          set +e
          if [[ "$(cat maintenance-output/state.status)" != "0" || "$(cat maintenance-output/decision.status)" != "0" || "$(cat maintenance-output/cycle.status)" != "0" ]]; then
            printf '1\n' > maintenance-output/queue.status
            exit 0
          fi
          cursor="$(cat maintenance-output/after-revision.txt)"
          python .agents/skills/gzh-maintain-skills/scripts/maintenance_queue.py --db maintenance-output/maintenance-state.db find-open-plan --head-sha "$GITHUB_SHA" --adapter-id gentoo-zh --canonical-repository gentoo-zh/overlay > maintenance-output/open-plan.json 2> maintenance-output/open-plan.log
          status=$?
          if (( status != 0 )); then
            printf '%s\n' "$status" > maintenance-output/queue.status
            cat maintenance-output/open-plan.log
            exit 0
          fi
          plan_id="$(jq -r '.plan_id // empty' maintenance-output/open-plan.json)"
          if [[ -n "$plan_id" ]]; then
            cursor="$(jq -r '.after_revision' maintenance-output/open-plan.json)"
            printf '%s\n' "$cursor" > maintenance-output/after-revision.txt
          else
            plan_id="maintenance-${GITHUB_SHA}-${cursor}"
          fi
          jq -n --slurpfile contract .agents/skills/gzh-maintain-skills/references/unattended-objective.json --arg repository "$GITHUB_REPOSITORY" --arg workflow ".github/workflows/reference-audit.yml" --arg head_sha "$GITHUB_SHA" --arg cursor "$cursor" '
                $contract[0] + {iteration: {
                  repository: $repository, workflow: $workflow,
                  head_sha: $head_sha,
                  after_revision: $cursor
                }}' > maintenance-output/maintenance-context.json
          python .agents/skills/gzh-maintain-skills/scripts/maintenance_queue.py --db maintenance-output/maintenance-state.db enqueue-default --plan-id "$plan_id" --context maintenance-output/maintenance-context.json --overlay-url https://github.com/gentoo-zh/overlay.git --adapter-id gentoo-zh --canonical-repository gentoo-zh/overlay --overlay-ref refs/heads/master --after-revision "$(cat maintenance-output/after-revision.txt)" --limit 500 > maintenance-output/queue-enqueue.log 2>&1
          status=$?
          if (( status == 0 )); then
            python .agents/skills/gzh-maintain-skills/scripts/maintenance_queue.py --db maintenance-output/maintenance-state.db run --plan-id "$plan_id" --worker "github-${GITHUB_RUN_ID}" --output-dir maintenance-output/queue-artifacts --evidence-db maintenance-output/maintenance-state.db --until-empty > maintenance-output/queue-run.log 2>&1
            status=$?
          fi
          python .agents/skills/gzh-maintain-skills/scripts/maintenance_queue.py --db maintenance-output/maintenance-state.db status --plan-id "$plan_id" --output maintenance-output/queue-report.json --markdown-output maintenance-output/queue-report.md > maintenance-output/queue-status.log 2>&1
          status_command=$?
          if (( status == 0 && status_command != 0 )); then
            status=$status_command
          fi
          printf '%s\n' "$status" > maintenance-output/queue.status
          cat maintenance-output/queue-enqueue.log
          cat maintenance-output/queue-run.log 2>/dev/null || true
          cat maintenance-output/queue-status.log
          exit 0
      - name: Summarize candidate review state
        if: always()
        shell: bash
        run: |
          set +e
          review_command_status=0
          if [[ ! -f maintenance-output/maintenance-state.db ]]; then
            echo "candidate review requires an existing maintenance state database" > maintenance-output/candidate-review.log
            review_command_status=1
          else
            python .agents/skills/gzh-maintain-skills/scripts/evidence_store.py --db maintenance-output/maintenance-state.db review-status > maintenance-output/candidate-review.json 2> maintenance-output/candidate-review.log
            review_command_status=$?
          fi
          if (( review_command_status == 0 )); then
            python .agents/skills/gzh-maintain-skills/scripts/evidence_store.py --db maintenance-output/maintenance-state.db review-status --format markdown > maintenance-output/candidate-review.md 2>> maintenance-output/candidate-review.log
            review_command_status=$?
          fi
          if (( review_command_status != 0 )); then
            jq -n --arg error "$(tail -c 12000 maintenance-output/candidate-review.log)" '{schema: 2, status: "error", review_required: true, counts: {}, candidates: [], error: $error}' > maintenance-output/candidate-review.json
            {
              printf '# Candidate evidence review\n\n'
              printf -- '- Status: `error`\n\n```text\n'
              tail -c 12000 maintenance-output/candidate-review.log
              printf '\n```\n'
            } > maintenance-output/candidate-review.md
          fi
          review_status=0
          if [[ "$(jq -r '.review_required' maintenance-output/candidate-review.json)" != "false" ]]; then
            review_status=1
          fi
          printf '%s\n' "$review_status" > maintenance-output/review.status
          exit 0
      - name: Prepare complete failure report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          state_status="$(cat maintenance-output/state.status 2>/dev/null || printf 1)"
          decision_status="$(cat maintenance-output/decision.status 2>/dev/null || printf 1)"
          queue_status="$(cat maintenance-output/queue.status 2>/dev/null || printf 1)"
          cycle_status="$(cat maintenance-output/cycle.status 2>/dev/null || printf 1)"
          review_status="$(cat maintenance-output/review.status 2>/dev/null || printf 1)"
          overall=1
          if [[ "$state_status" == "0" && "$decision_status" == "0" && "$queue_status" == "0" && "$cycle_status" == "0" && "$review_status" == "0" ]]; then
            overall=0
          fi
          printf '%s\n' "$overall" > maintenance-output/overall.status
          if [[ ! -f maintenance-output/maintenance-report.md ]]; then
            {
              printf '<!-- gentoo-zh-skills-maintenance:v1 -->\n'
              printf '# Skill maintenance review required\n\n'
              printf 'The durable maintenance queue did not complete.\n\n'
              printf 'No complete maintenance report was produced.\n'
            } > maintenance-output/maintenance-report.md
          fi
          if [[ -f maintenance-output/queue-report.md ]]; then
            printf '\n' >> maintenance-output/maintenance-report.md
            cat maintenance-output/queue-report.md >> maintenance-output/maintenance-report.md
          fi
          if [[ -f maintenance-output/candidate-review.md ]]; then
            printf '\n' >> maintenance-output/maintenance-report.md
            cat maintenance-output/candidate-review.md >> maintenance-output/maintenance-report.md
          fi
          if (( overall != 0 )); then
            sed -i \
              -e 's/^- Result: pass$/- Result: review required/' \
              -e 's/^- Result: scoped pass$/- Result: review required/' \
              maintenance-output/maintenance-report.md
          fi
          if [[ ! -f maintenance-output/maintenance-report.json ]]; then
            jq -n '{schema: 1, ok: false, complete: false, truncated: false}' > maintenance-output/maintenance-report.json
          fi
          if [[ ! -f maintenance-output/candidate-review.json ]]; then
            jq -n '{schema: 2, status: "error", review_required: true, counts: {}, candidates: [], error: "candidate review status was not produced"}' > maintenance-output/candidate-review.json
          fi
          if [[ ! -f maintenance-output/candidate-decision.json ]]; then
            jq -n '{schema: 1, status: "error", changed: false, error: "candidate decision status was not produced"}' > maintenance-output/candidate-decision.json
          fi
          jq --slurpfile decision maintenance-output/candidate-decision.json --slurpfile review maintenance-output/candidate-review.json --argjson state "$state_status" --argjson decision_status "$decision_status" --argjson queue "$queue_status" --argjson cycle "$cycle_status" --argjson review_status "$review_status" --argjson overall "$overall" '
            .candidate_decision = $decision[0]
            | .candidate_review = $review[0]
            | .status = {state: $state, decision: $decision_status, queue: $queue, cycle: $cycle, review: $review_status}
            | if $overall != 0 then .ok = false | .complete = false else . end
          ' maintenance-output/maintenance-report.json > maintenance-output/maintenance-report.prepared.json
          mv maintenance-output/maintenance-report.prepared.json maintenance-output/maintenance-report.json
      - name: Seal maintenance state
        if: always()
        shell: bash
        run: |
          set +e
          if [[ ! -f maintenance-output/maintenance-state.db ]]; then
            echo "maintenance state database was not created" > maintenance-output/state-seal.log
            printf '1\n' > maintenance-output/state-seal.status
            printf '1\n' > maintenance-output/overall.status
            exit 0
          fi
          python .agents/skills/gzh-maintain-skills/scripts/maintenance_queue.py --db maintenance-output/maintenance-state.db compact --keep-plans 16 > maintenance-output/queue-compact.log 2>&1
          queue_compact_status=$?
          python .agents/skills/gzh-maintain-skills/scripts/evidence_store.py --db maintenance-output/maintenance-state.db compact --keep-runs 32 > maintenance-output/evidence-compact.log 2>&1
          evidence_compact_status=$?
          if (( queue_compact_status != 0 || evidence_compact_status != 0 )); then
            printf '1\n' > maintenance-output/state-seal.status
            printf '1\n' > maintenance-output/overall.status
            cat maintenance-output/queue-compact.log
            cat maintenance-output/evidence-compact.log
            exit 0
          fi
          jq -n --slurpfile candidate_decision maintenance-output/candidate-decision.json --arg repository "$GITHUB_REPOSITORY" --arg workflow ".github/workflows/reference-audit.yml" --arg head_sha "$GITHUB_SHA" --arg event "$GITHUB_EVENT_NAME" --arg restore_mode "$(cat maintenance-output/state-bootstrap.txt 2>/dev/null || true)" --arg reviewed_seed "$(cat maintenance-output/reviewed-seed.txt 2>/dev/null || true)" --argjson run_id "$GITHUB_RUN_ID" '{
              repository: $repository,
              workflow: $workflow,
              default_branch: "master",
              run_id: $run_id,
              head_sha: $head_sha,
              event: $event,
              state_restore: {mode: $restore_mode, reviewed_seed: $reviewed_seed},
              candidate_decision: ($candidate_decision[0] | {
                status, changed, actor, action
              })
            }' > maintenance-output/state-metadata.json
          python .agents/skills/gzh-maintain-skills/scripts/state_bundle.py create --database maintenance-output/maintenance-state.db --manifest maintenance-output/maintenance-state.manifest.json --metadata maintenance-output/state-metadata.json > maintenance-output/state-seal.log 2>&1
          status=$?
          if (( status == 0 )); then
            (
              set -euo pipefail
              staging="maintenance-output/state-artifact.staging"
              mkdir "$staging"
              cp maintenance-output/maintenance-state.db "$staging/"
              cp maintenance-output/maintenance-state.manifest.json "$staging/"
              python .agents/skills/gzh-maintain-skills/scripts/state_bundle.py verify --database "$staging/maintenance-state.db" --manifest "$staging/maintenance-state.manifest.json"
              mv "$staging" maintenance-output/state-artifact
            ) >> maintenance-output/state-seal.log 2>&1
            status=$?
          fi
          printf '%s\n' "$status" > maintenance-output/state-seal.status
          if (( status != 0 )); then
            printf '1\n' > maintenance-output/overall.status
          fi
          cat maintenance-output/state-seal.log
          exit 0
      - name: Preserve authenticated maintenance state
        id: state_upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: skill-maintenance-state
          path: |
            maintenance-output/state-artifact/maintenance-state.db
            maintenance-output/state-artifact/maintenance-state.manifest.json
          if-no-files-found: error
      - name: Finalize report after state persistence
        if: always()
        env:
          STATE_UPLOAD_OUTCOME: ${{ steps.state_upload.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          seal_status="$(cat maintenance-output/state-seal.status 2>/dev/null || printf 1)"
          upload_status=1
          if [[ "$STATE_UPLOAD_OUTCOME" == "success" ]]; then
            upload_status=0
          fi
          if [[ "$seal_status" == "0" && "$upload_status" == "0" ]]; then
            exit 0
          fi
          printf '1\n' > maintenance-output/overall.status
          queue_compact="$(tail -c 6000 maintenance-output/queue-compact.log 2>/dev/null || true)"
          evidence_compact="$(tail -c 6000 maintenance-output/evidence-compact.log 2>/dev/null || true)"
          state_seal="$(tail -c 6000 maintenance-output/state-seal.log 2>/dev/null || true)"
          if ! jq --arg status "$seal_status" --arg upload_status "$upload_status" --arg upload_outcome "$STATE_UPLOAD_OUTCOME" --arg queue_compact "$queue_compact" --arg evidence_compact "$evidence_compact" --arg state_seal "$state_seal" '
                .ok = false
                | .complete = false
                | .state_persistence = {
                    ok: false,
                    status: ($status | tonumber),
                    upload_status: ($upload_status | tonumber),
                    upload_outcome: $upload_outcome,
                    queue_compaction: $queue_compact,
                    evidence_compaction: $evidence_compact,
                    state_seal: $state_seal
                  }
              ' maintenance-output/maintenance-report.json > maintenance-output/maintenance-report.final.json; then
            jq -n --arg status "$seal_status" --arg upload_status "$upload_status" --arg upload_outcome "$STATE_UPLOAD_OUTCOME" --arg queue_compact "$queue_compact" --arg evidence_compact "$evidence_compact" --arg state_seal "$state_seal" '{
              schema: 1,
              ok: false,
              complete: false,
              truncated: false,
              state_persistence: {
                ok: false,
                status: ($status | tonumber),
                upload_status: ($upload_status | tonumber),
                upload_outcome: $upload_outcome,
                queue_compaction: $queue_compact,
                evidence_compaction: $evidence_compact,
                state_seal: $state_seal
              }
            }' > maintenance-output/maintenance-report.final.json
          fi
          mv maintenance-output/maintenance-report.final.json maintenance-output/maintenance-report.json
          sed -i \
            -e 's/^- Result: pass$/- Result: review required/' \
            -e 's/^- Result: scoped pass$/- Result: review required/' \
            maintenance-output/maintenance-report.md
          {
            printf '\n## State persistence\n\n'
            printf 'State compaction, sealing, or upload failed. The previous authenticated state remains authoritative.\n'
            for entry in \
              "queue compaction|$queue_compact" \
              "evidence compaction|$evidence_compact" \
              "state seal|$state_seal" \
              "state upload|$STATE_UPLOAD_OUTCOME"; do
              name="${entry%%|*}"
              detail="${entry#*|}"
              if [[ -n "$detail" ]]; then
                printf '\n### %s\n\n```text\n%s\n```\n' "$name" "$detail"
              fi
            done
          } >> maintenance-output/maintenance-report.md
      - name: Preserve the complete report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: skill-maintenance-report
          path: |
            maintenance-output/maintenance-report.json
            maintenance-output/maintenance-report.md
            maintenance-output/queue-report.json
            maintenance-output/queue-report.md
            maintenance-output/maintenance-context.json
            maintenance-output/after-revision.txt
            maintenance-output/state-bootstrap.txt
            maintenance-output/state-restore-decision.json
            maintenance-output/reviewed-seed.txt
            maintenance-output/authenticated-state.json
            maintenance-output/authenticated-provenance.json
            maintenance-output/candidate-decision.json
            maintenance-output/candidate-decision-result.json
            maintenance-output/candidate-decision.log
            maintenance-output/candidate-checklist.json
            maintenance-output/candidate-review.json
            maintenance-output/candidate-review.md
            maintenance-output/candidate-review.log
            maintenance-output/workflow-runs.json
            maintenance-output/state-restore.log
            maintenance-output/state-seal.log
            maintenance-output/open-plan.json
            maintenance-output/open-plan.log
            maintenance-output/queue-enqueue.log
            maintenance-output/queue-run.log
            maintenance-output/queue-status.log
            maintenance-output/queue-compact.log
            maintenance-output/evidence-compact.log
            maintenance-output/*.status
          if-no-files-found: error
      - name: Synchronize the review issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t numbers < <(gh issue list --state open --limit 1000 --json number,title --jq '.[] | select(.title == "Skill maintenance review required") | .number')
          if (( ${#numbers[@]} > 1 )); then
            echo "multiple open maintenance issues found" >&2
            exit 1
          fi
          number="${numbers[0]:-}"
          status="$(cat maintenance-output/overall.status)"
          if [[ "$status" != "0" ]]; then
            if [[ -n "$number" ]]; then
              gh issue view "$number" --json body --jq '.body' > maintenance-output/current-issue-body.md
              if ! cmp -s maintenance-output/current-issue-body.md maintenance-output/maintenance-report.md; then
                gh issue edit "$number" --body-file maintenance-output/maintenance-report.md
              fi
            else
              gh issue create --title "Skill maintenance review required" --body-file maintenance-output/maintenance-report.md
            fi
          elif [[ -n "$number" ]]; then
            gh issue close "$number" --comment "The scheduled maintenance cycle is current."
          fi
      - name: Fail after preserving maintenance evidence
        if: always()
        run: test "$(cat maintenance-output/overall.status)" = "0"
