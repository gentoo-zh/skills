name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: gzh/pyproject.toml
      - name: Install test environment
        run: python -m pip install -e './gzh[test]'
      - name: Validate repository
        run: python scripts/validate_repository.py
      - name: Run tests
        run: python -m pytest -q gzh/tests tests
      - name: Compile Python sources
        run: python -m compileall -q gzh/gzh scripts .agents/skills
